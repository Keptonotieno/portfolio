<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Intercept and sanitize WebSocket connection issues globally for Vite HMR
      try {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const WebSocketProxy = new Proxy(OriginalWebSocket, {
            construct(target, args) {
              try {
                const ws = Reflect.construct(target, args);
                ws.addEventListener('error', (e) => {
                  console.debug('Silent HMR socket connection error intercepted.');
                });
                return ws;
              } catch (err) {
                console.debug('Failed to initialize socket:', err);
                const dummy = {
                  addEventListener: () => {},
                  removeEventListener: () => {},
                  close: () => {},
                  send: () => {},
                  readyState: 3 // CLOSED
                };
                return dummy;
              }
            }
          });
          window.WebSocket = WebSocketProxy;
        }
      } catch (e) {
        console.warn('Unable to patch WebSocket:', e);
      }

      // Gracefully handle and suppress benign HMR WebSocket errors/rejections
      window.addEventListener('unhandledrejection', function(event) {
        const reason = event?.reason;
        const msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        
        if (
          msg.includes('WebSocket') || 
          msg.includes('websocket') || 
          msg.includes('WS') ||
          msg.includes('closed without opened') ||
          msg.includes('failed to connect')
        ) {
          event.preventDefault();
          event.stopPropagation();
          console.debug('Suppressed benign HMR websocket unhandled rejection:', reason);
        }
      });

      window.addEventListener('error', function(event) {
        const message = event.message || '';
        if (
          message.includes('WebSocket') || 
          message.includes('websocket') || 
          message.includes('WS') ||
          message.includes('closed without opened') ||
          message.includes('failed to connect')
        ) {
          event.preventDefault();
          event.stopPropagation();
          console.debug('Suppressed benign HMR websocket error:', message);
        }
      }, true);

      // Hide the Vite error overlay for HMR connection errors
      const style = document.createElement('style');
      style.innerHTML = `
        vite-error-overlay {
          display: none !important;
          opacity: 0 !important;
          pointer-events: none !important;
        }
      `;
      document.head.appendChild(style);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
